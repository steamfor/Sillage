<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#163e30"><title>Sillage — Généalogie</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#19382d;background:#f7f5ee}*{box-sizing:border-box}body{margin:0}header{background:#163e30;color:white;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{margin:0;font-family:Georgia,serif;font-size:30px}header small{color:#d0e3d9}main{max-width:1100px;margin:auto;padding:20px}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:20px}button,.filelabel{border:1px solid #b9c9be;border-radius:10px;background:white;padding:10px 14px;cursor:pointer;color:#163e30;font-weight:600}button.primary{background:#215943;color:white}input{border:1px solid #b9c9be;border-radius:10px;padding:11px;min-width:190px;flex:1}#tree{overflow:auto;background:#fffefa;border:1px solid #e1e4d9;border-radius:18px;padding:24px;min-height:280px}.generation{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:12px 0}.person{min-width:170px;max-width:220px;text-align:left;background:#f3f6f0;border:1px solid #b8c8b8;border-radius:13px;padding:14px}.person.selected{outline:3px solid #42795e}.person span{display:block;font-size:12px;color:#607367;margin-top:5px}.connector{text-align:center;color:#769985;font-size:24px}.panel{background:white;border-radius:16px;border:1px solid #e1e4d9;padding:20px;margin-top:18px}h2{font-family:Georgia,serif;margin-top:0}.muted{color:#66786c}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.fields label{font-size:13px;display:flex;flex-direction:column;gap:5px}.fields input{width:100%;min-width:0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}#status{font-size:13px;color:#617568}footer{text-align:center;padding:20px;font-size:12px;color:#718076}@media(max-width:600px){main{padding:12px}header{padding:14px}h1{font-size:26px}.person{min-width:140px}#tree{padding:14px}}
</style></head><body><header><div><h1>✦ Sillage</h1><small>Les histoires qui nous relient</small></div><span>v0.1</span></header><main>
<div class="toolbar"><input id="search" placeholder="Rechercher une personne…" aria-label="Rechercher"><button class="primary" id="add">+ Personne</button><button id="export">Exporter JSON</button><label class="filelabel">Importer JSON<input type="file" id="import" accept=".json,application/json" hidden></label></div>
<section id="tree" aria-label="Arbre familial"></section><section class="panel"><h2 id="panelTitle">Fiche individuelle</h2><p id="hint" class="muted">Sélectionnez une personne dans l'arbre.</p><form id="form" hidden><div class="fields"><label>Prénom<input name="first" required></label><label>Nom<input name="last" required></label><label>Naissance<input name="birth" placeholder="AAAA-MM-JJ"></label><label>Décès<input name="death" placeholder="AAAA-MM-JJ"></label><label>Lieu<input name="place"></label><label>Identifiant du parent<input name="parent" placeholder="Facultatif"></label><label>Notes / sources<input name="notes"></label></div><div class="actions"><button class="primary" type="submit">Enregistrer</button><button type="button" id="delete">Supprimer</button></div></form></section><p id="status" role="status"></p></main><footer>Données enregistrées uniquement dans ce navigateur. Exportez régulièrement une sauvegarde.</footer>
<script>
const KEY='sillage-persons-v1';
const demo=[{id:'p1',first:'Jean',last:'Martin',birth:'1920',death:'1988',place:'',parent:'',notes:'Personnage fictif'},{id:'p2',first:'Claire',last:'Martin',birth:'1951',death:'',place:'',parent:'p1',notes:'Personnage fictif'},{id:'p3',first:'Thomas',last:'Martin',birth:'1978',death:'',place:'',parent:'p2',notes:'Personnage fictif'},{id:'p4',first:'Élise',last:'Martin',birth:'1982',death:'',place:'',parent:'p2',notes:'Personnage fictif'}];
let persons;try{const saved=JSON.parse(localStorage.getItem(KEY));persons=Array.isArray(saved)?saved:demo}catch{persons=demo}
let selected=null;const $=id=>document.getElementById(id);const clean=v=>String(v??'');function save(){localStorage.setItem(KEY,JSON.stringify(persons));$('status').textContent='Modifications enregistrées sur cet appareil.'}
function depth(p,visited=new Set()){if(!p.parent||visited.has(p.id))return 0;const par=persons.find(x=>x.id===p.parent);if(!par)return 0;visited.add(p.id);return Math.min(12,1+depth(par,visited))}
function render(){const q=$('search').value.toLocaleLowerCase('fr');const filtered=persons.filter(p=>(p.first+' '+p.last+' '+p.place).toLocaleLowerCase('fr').includes(q));const tree=$('tree');tree.replaceChildren();if(!filtered.length){tree.textContent='Aucune personne trouvée.';return}const levels=[...new Set(filtered.map(p=>depth(p)))].sort((a,b)=>a-b);levels.forEach((level,i)=>{if(i){const line=document.createElement('div');line.className='connector';line.textContent='↓';tree.append(line)}const row=document.createElement('div');row.className='generation';filtered.filter(p=>depth(p)===level).forEach(p=>{const b=document.createElement('button');b.className='person'+(p.id===selected?' selected':'');const name=document.createElement('strong');name.textContent=p.first+' '+p.last;const dates=document.createElement('span');dates.textContent=(p.birth||'?')+' — '+(p.death||'');b.append(name,dates);b.onclick=()=>select(p.id);row.append(b)});tree.append(row)})}
function select(id){selected=id;const p=persons.find(x=>x.id===id);$('hint').hidden=!!p;$('form').hidden=!p;$('panelTitle').textContent=p?p.first+' '+p.last:'Fiche individuelle';if(p)for(const field of $('form').elements)if(field.name)field.value=clean(p[field.name]);render()}
$('search').oninput=render;$('add').onclick=()=>{const id='p'+crypto.randomUUID();persons.push({id,first:'Nouvelle',last:'personne',birth:'',death:'',place:'',parent:'',notes:''});save();$('search').value='';select(id)};
$('form').onsubmit=e=>{e.preventDefault();const p=persons.find(x=>x.id===selected);const fd=new FormData(e.target);for(const [k,v]of fd)p[k]=clean(v).trim();if(p.parent===p.id||p.parent&&!persons.some(x=>x.id===p.parent)){alert('Identifiant du parent invalide.');return}save();select(p.id)};
$('delete').onclick=()=>{if(!selected||!confirm('Supprimer cette personne ?'))return;persons=persons.filter(p=>p.id!==selected);persons.forEach(p=>{if(p.parent===selected)p.parent=''});selected=null;save();select(null)};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({format:'sillage-v1',persons},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='sillage-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(obj.format!=='sillage-v1'||!Array.isArray(obj.persons)||!obj.persons.every(p=>typeof p.id==='string'&&typeof p.first==='string'&&typeof p.last==='string'))throw Error('Format incompatible');if(!confirm('Remplacer toutes les personnes locales par cette sauvegarde ?'))return;persons=obj.persons;selected=null;save();select(null)}catch(err){alert('Import impossible : '+err.message)}finally{e.target.value=''}};render();
</script></body></html>
